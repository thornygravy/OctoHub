# OctoHub config
# Edit this file, save it, and refresh the page. No rebuild needed.

# Page title (optional, defaults to "OctoHub")
title: "OctoHub"

# Online/offline indicator on each card (optional, on by default)
status:
  enabled: true                     # set to false to turn it off
  interval: 30                      # seconds between checks, 5 to 3600

printers:
  - name: "Blazar"                  # required
    model: "Prusa i3 MK3S+"         # optional, shown under the name
    url: "192.168.1.101"            # required, where the card links to
    color: "#f05a65"                # optional, accent color for the card

  - name: "Matter"
    model: "Prusa i3 MK3S+"
    url: "192.168.1.102"
    color: "#b7becd"
